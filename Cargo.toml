[workspace]
members = [
  "cli-common",
  "love",
  "happiness",
  "joy",
  "patience",
  "sprinkle",
  "later",
  "enough",
  "stuck",
  "duck",
  "one",
  "afk",
  "goodnight",
  "proof",
  "poke",
]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
clap = "4.5"
rand = "0.8"
cli-common = { path = "cli-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rustix = { version = "1", features = ["process", "termios", "fs"] }
jiff = { version = "0.2", default-features = false, features = [
  "std",
  "tz-system",
  "tzdb-zoneinfo",
] }
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm_0_29",
] }
signal-hook = { version = "0.3.18", default-features = false }
libc = "0.2"
