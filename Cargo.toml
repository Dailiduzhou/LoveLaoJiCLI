[workspace]
members = ["cli-common", "love", "happiness", "joy", "patience", "sprinkle", "later", "enough", "stuck", "duck", "one", "afk"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
clap = "4.5"
rand = "0.8"
cli-common = { path = "cli-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rustix = { version = "1", features = ["process", "termios", "fs"] }
